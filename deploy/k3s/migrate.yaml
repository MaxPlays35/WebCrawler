apiVersion: batch/v1
kind: Job
metadata:
  name: crawler-migrate
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: CRAWLER_IMAGE
          envFrom:
            - secretRef: {name: crawler-connections}
          args: [--migrate]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
