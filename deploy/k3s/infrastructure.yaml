apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: {app: postgres}
  ports:
    - {port: 5432, targetPort: 5432}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: {app: postgres}
  template:
    metadata:
      labels: {app: postgres}
    spec:
      containers:
        - name: postgres
          image: postgres:18-alpine
          envFrom:
            - secretRef: {name: postgres-auth}
          ports:
            - {containerPort: 5432}
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: '2', memory: 4Gi}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 10Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector: {app: mongodb}
  ports:
    - {port: 27017, targetPort: 27017}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
spec:
  serviceName: mongodb
  replicas: 1
  selector:
    matchLabels: {app: mongodb}
  template:
    metadata:
      labels: {app: mongodb}
    spec:
      initContainers:
        - name: keyfile
          image: mongo:8.0
          command: [sh, -ec, 'cp /secret/keyfile /keyfile/keyfile; chown mongodb:mongodb /keyfile/keyfile; chmod 400 /keyfile/keyfile']
          volumeMounts:
            - {name: key-secret, mountPath: /secret, readOnly: true}
            - {name: keyfile, mountPath: /keyfile}
      containers:
        - name: mongodb
          image: mongo:8.0
          args: [--replSet, rs0, --bind_ip_all, --keyFile, /keyfile/keyfile]
          envFrom:
            - secretRef: {name: mongodb-auth}
          ports:
            - {containerPort: 27017}
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - 'quit(db.hello().isWritablePrimary ? 0 : 1)'
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {cpu: '2', memory: 8Gi}
          volumeMounts:
            - {name: data, mountPath: /data/db}
            - {name: keyfile, mountPath: /keyfile, readOnly: true}
      volumes:
        - name: key-secret
          secret: {secretName: mongodb-keyfile}
        - name: keyfile
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests: {storage: 20Gi}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: mongodb-init
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: mongo:8.0
          envFrom:
            - secretRef: {name: mongodb-auth}
          command:
            - sh
            - -ec
            - |
              mongosh --host mongodb-0.mongodb --quiet \
                --username "$MONGO_INITDB_ROOT_USERNAME" \
                --password "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin \
                --eval 'try { rs.status() } catch (e) { if (e.code !== 94) throw e; rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb-0.mongodb:27017"}]}) }'
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo-express
spec:
  replicas: 1
  selector:
    matchLabels: {app: mongo-express}
  template:
    metadata:
      labels: {app: mongo-express}
    spec:
      containers:
        - name: mongo-express
          image: mongo-express:1.0.2
          envFrom:
            - secretRef: {name: mongo-express-auth}
          env:
            - {name: ME_CONFIG_MONGODB_ENABLE_ADMIN, value: 'true'}
            - {name: ME_CONFIG_BASICAUTH_ENABLED, value: 'true'}
          ports:
            - {containerPort: 8081}
          readinessProbe:
            tcpSocket: {port: 8081}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: mongo-express
spec:
  selector: {app: mongo-express}
  ports:
    - {port: 8081, targetPort: 8081}
