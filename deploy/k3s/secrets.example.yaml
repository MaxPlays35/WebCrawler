# Example values only. Copy to secrets.local.yaml and replace before deployment.
# Keep passwords consistent with both connection strings below.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-auth
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_DB: crawler
  POSTGRES_PASSWORD: example-postgres-password
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-auth
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: crawler
  MONGO_INITDB_ROOT_PASSWORD: example-mongo-password
---
apiVersion: v1
kind: Secret
metadata:
  name: mongodb-keyfile
type: Opaque
stringData:
  # Replace with: openssl rand -base64 512 | tr -d '\n'
  keyfile: ZXhhbXBsZU1vbmdvUmVwbGljYVNldEtleUNoYW5nZUJlZm9yZURlcGxveW1lbnQxMjM0NTY3ODkw
---
apiVersion: v1
kind: Secret
metadata:
  name: crawler-connections
type: Opaque
stringData:
  ConnectionStrings__postgres: 'Host=postgres;Port=5432;Database=crawler;Username=postgres;Password=example-postgres-password'
  ConnectionStrings__mongo: 'mongodb://crawler:example-mongo-password@mongodb-0.mongodb:27017/crawler?authSource=admin&replicaSet=rs0'
---
apiVersion: v1
kind: Secret
metadata:
  name: mongo-express-auth
type: Opaque
stringData:
  ME_CONFIG_MONGODB_URL: 'mongodb://crawler:example-mongo-password@mongodb-0.mongodb:27017/crawler?authSource=admin&replicaSet=rs0'
  ME_CONFIG_BASICAUTH_USERNAME: admin
  ME_CONFIG_BASICAUTH_PASSWORD: example-viewer-password
